name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]" pip-audit
      - run: pip-audit
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/later
      - run: coverage run --source=later -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: coverage report --fail-under=65
